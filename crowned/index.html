<title>Crowned — Menu de Criativos</title>
<style>
  :root{
    --bg:#F5F5F2; --card:#FFFFFF; --card-2:#FAFAF8;
    --ink:#14151A; --ink-soft:#5B5E68; --ink-faint:#9497A1;
    --line:rgba(20,21,26,0.08); --line-strong:rgba(20,21,26,0.14);
    --accent:#8A6D3B; --accent-2:#C9A25C;
    --shadow-sm:0 1px 2px rgba(20,21,26,.05);
    --shadow:0 1px 3px rgba(20,21,26,.06), 0 10px 30px -12px rgba(20,21,26,.16);
    --shadow-lg:0 4px 12px rgba(20,21,26,.08), 0 24px 48px -16px rgba(20,21,26,.22);
    --sans:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E0F12; --card:#17181C; --card-2:#1D1F24;
      --ink:#F2F2F0; --ink-soft:#ABAEB8; --ink-faint:#71747E;
      --line:rgba(242,242,240,0.09); --line-strong:rgba(242,242,240,0.16);
      --accent:#C9A25C; --accent-2:#D9BA7E;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
      --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 24px 48px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0F12; --card:#17181C; --card-2:#1D1F24;
    --ink:#F2F2F0; --ink-soft:#ABAEB8; --ink-faint:#71747E;
    --line:rgba(242,242,240,0.09); --line-strong:rgba(242,242,240,0.16);
    --accent:#C9A25C; --accent-2:#D9BA7E;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 24px 48px -16px rgba(0,0,0,.7);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 24px 100px; }

  .hero{ position:relative; text-align:center; padding:64px 0 8px; }
  .hero-glow{ position:absolute; top:-30px; left:50%; transform:translateX(-50%); width:320px; height:320px; background:radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity:.16; filter:blur(50px); pointer-events:none; }
  .hero img{ position:relative; width:130px; height:auto; border-radius:8px; filter:drop-shadow(0 18px 26px rgba(20,21,26,.16)); margin:0 0 22px; }
  .kicker{ position:relative; display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2)); padding:6px 14px; border-radius:99px; margin-bottom:16px; }
  .title{ position:relative; font-weight:800; font-size:clamp(32px,7vw,44px); letter-spacing:-.03em; line-height:1.05; margin:0 0 44px; }

  .group{ margin:0 0 36px; }
  .group-label{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 14px; padding-left:2px; }
  .group-label::before{ content:''; width:6px; height:6px; border-radius:99px; background:var(--accent); }

  .link-btn{ display:flex; align-items:center; justify-content:space-between; gap:14px; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin:0 0 12px; box-shadow:var(--shadow-sm); transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
  .link-btn:hover{ box-shadow:var(--shadow-lg); transform:translateY(-3px); border-color:var(--accent); }
  .link-btn .row{ display:flex; align-items:center; gap:14px; min-width:0; }
  .link-btn .icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; background:var(--card-2); flex-shrink:0; }
  .link-btn .text{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .link-btn .name{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .link-btn .desc{ font-size:12px; color:var(--ink-faint); font-family:var(--mono); }
  .link-btn .arrow{ color:var(--ink-faint); font-size:18px; flex-shrink:0; transition:transform .2s, color .2s; }
  .link-btn:hover .arrow{ color:var(--accent); transform:translateX(3px); }
  .badge{ font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius:99px; padding:3px 10px; white-space:nowrap; }

  .cta-btn{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:transparent; color:#fff; }
  .cta-btn .icon{ background:rgba(255,255,255,.18); }
  .cta-btn .desc{ color:rgba(255,255,255,.75); }
  .cta-btn .arrow{ color:rgba(255,255,255,.85); }
  .cta-btn:hover{ transform:translateY(-3px) scale(1.008); }
  .cta-btn:hover .arrow{ color:#fff; }

  footer{ margin-top:52px; padding-top:22px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); font-family:var(--mono); text-align:center; }
</style>

    <h1 class="title">Crowned</h1>

      <span class="arrow">→</span>

    <a class="link-btn" href="advertoriais/adv2/index.html" target="_blank">

      <span class="arrow">→</span>
    </a>
    <a class="link-btn" href="advertoriais/adv3/index.html" target="_blank">
      <span class="row"><span class="icon">📰</span><span class="text"><span class="name">ADV3</span></span></span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn" href="advertoriais/adv4/index.html" target="_blank">

      <span class="arrow">→</span>
    </a>
  </div>

  <div class="group">
    <p class="group-label">Criativos</p>
    <a class="link-btn cta-btn" href="imagens.html">
      <span class="row"><span class="icon">🖼️</span><span class="text"><span class="name">Ads em Imagem (8)</span><span class="desc">textos primários EN/PT · copiar</span></span></span>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>Crowned · portfólio pra análise do mentor de Taboola</footer>
</div>
