<title>SlimSoda — Menu de Criativos</title>
<style>
  :root{
    --paper: #EEEBE3; --paper-raised: #FAF8F3; --paper-sunken: #E4E0D6;
    --ink: #211E1A; --ink-soft: #55504A; --ink-faint: #8A8478;
    --accent: #C85A2E; --accent-soft: #E0834F; --gold: #9C6B1F;
    --line: rgba(33,30,26,0.14); --line-strong: rgba(33,30,26,0.26);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#17181A; --paper-raised:#1F2023; --paper-sunken:#131415;
      --ink:#ECE9E2; --ink-soft:#A8A39A; --ink-faint:#726C63;
      --accent:#E0834F; --accent-soft:#C85A2E; --gold:#D9A34E;
      --line:rgba(236,233,226,0.14); --line-strong:rgba(236,233,226,0.24);
    }
  }
  :root[data-theme="dark"]{
    --paper:#17181A; --paper-raised:#1F2023; --paper-sunken:#131415;
    --ink:#ECE9E2; --ink-soft:#A8A39A; --ink-faint:#726C63;
    --accent:#E0834F; --accent-soft:#C85A2E; --gold:#D9A34E;
    --line:rgba(236,233,226,0.14); --line-strong:rgba(236,233,226,0.24);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:640px; margin:0 auto; padding:64px 24px 100px; }

  .hero{ text-align:center; margin:0 0 48px; }
  .hero img{ width:130px; height:auto; margin:0 0 20px; }
  .doc-kicker{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  .doc-title{ font-family:var(--serif); font-weight:600; font-size:clamp(26px,5vw,34px); line-height:1.15; letter-spacing:-.01em; margin:0; }

  .group{ margin:0 0 40px; }
  .group-label{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 12px; padding-left:2px; }

  .link-btn{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    text-decoration:none; color:var(--ink); background:var(--paper-raised);
    border:1px solid var(--line-strong); border-radius:8px; padding:18px 20px;
    margin:0 0 10px; transition:border-color .15s ease, transform .1s ease;
  }
  .link-btn:hover{ border-color:var(--accent); transform:translateX(2px); }
  .link-btn .name{ font-weight:600; font-size:16px; display:flex; align-items:center; gap:10px; }
  .link-btn .arrow{ color:var(--accent); font-size:18px; }
  .link-btn .badge{ font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; color:#fff; background:var(--gold); border-radius:99px; padding:3px 10px; }

  .media-btn{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .media-btn .arrow{ color:var(--accent-soft); }
  .media-btn:hover{ border-color:var(--accent); }

  footer{ margin-top:56px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); font-family:var(--mono); text-align:center; }
</style>

<div class="wrap">

  <div class="hero">
    <img src="assets/product.webp" alt="SlimSoda">
    <p class="doc-kicker">Portfólio de criativos</p>
    <h1 class="doc-title">SlimSoda</h1>
  </div>

  <div class="group">
    <p class="group-label">Advertoriais</p>
    <a class="link-btn" href="advertoriais/adv1.html" target="_blank">
      <span class="name">ADV1 — The Original Recipe <span class="badge">🏆 Principal</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn" href="advertoriais/adv2.html" target="_blank">
      <span class="name">ADV2 — Reader Warning</span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn" href="advertoriais/adv3.html" target="_blank">
      <span class="name">ADV3 — Two Column</span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn" href="advertoriais/adv4.html" target="_blank">
      <span class="name">ADV4 — Exclusive Report</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="group">
    <p class="group-label">Criativos</p>
    <a class="link-btn media-btn" href="imagens.html">
      <span class="name">🖼️ Ads em Imagem (8)</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>SlimSoda · portfólio pra análise do mentor de Taboola</footer>
</div>
